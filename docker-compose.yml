services:
  postgres:
    image: postgres:16-alpine
    container_name: lumina-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: lumina123
      POSTGRES_DB: lumina
    volumes:
      - lumina_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina -d lumina"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  lumina_pg_data:
